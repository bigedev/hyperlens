name: hyperlens
description: "Source-linked preview for Markdown and HTML: rendering, outline and reading position share one address (source line or DOM path), so editors can jump either way."
version: 0.2.1
repository: https://github.com/bigedev/hyperlens          # 必须是境外可达地址（pana 从境外抓，且只认 GitHub / GitLab / Bitbucket）
issue_tracker: https://github.com/bigedev/hyperlens/issues
# 不写 homepage：它也会被 pana 抓，指向 atomgit 等于再报一条 unreachable

topics:
  - markdown
  - html
  - preview
  - syntax-tree
  - editor

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.22.0'

# 是 Flutter 包，但 lib/ 里不 import flutter —— 声明 sdk 只为下面的 assets 段，
# 代码层保持纯 Dart（@immutable 用 meta，不用 foundation）。
dependencies:
  flutter:
    sdk: flutter
  meta: ^1.16.0
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

# 资产的唯一声明处：调用方不要再声明同名路径（重复声明会让两处都可能失效）。
flutter:
  assets:
    - assets/web/
